[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 (function call in a default argument) flags every FastAPI
# `Depends(...)`/`File(...)`/`Form(...)` parameter, which is the framework's
# idiomatic pattern, not a bug.
ignore = ["B008"]
