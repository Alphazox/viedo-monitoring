services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-change-me-in-dev}"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-change-me-in-dev} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # DATABASE_URL comes straight from .env -- a Supabase (or any other
      # managed Postgres) connection string, not a local container. See
      # .env.example for the expected format (postgresql+psycopg://... with
      # sslmode=require).
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-me-in-dev}@redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/backend/storage
      - ./scripts:/scripts:ro
    depends_on:
      redis:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python /scripts/seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g

  ai-engine:
    build: ./ai-engine
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 8001
      ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8001:8001"
    volumes:
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

  video-engine:
    build: ./video-engine
    restart: unless-stopped
    env_file: .env
    environment:
      BACKEND_URL: http://backend:8000
      AI_ENGINE_URL: http://ai-engine:8001
    ports:
      - "8002:8002"
    volumes:
      - ./storage:/app/storage
    depends_on:
      backend:
        condition: service_healthy
      ai-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_AI_ENGINE_URL: http://localhost:8001
        NEXT_PUBLIC_VIDEO_ENGINE_URL: http://localhost:8002
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
      ai-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g

volumes:
  postgres_data:
